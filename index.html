    <script>
      // Set theme before first paint (no flash). Stored choice wins,
      // otherwise follow the OS preference.
      // Inline (not external) so there's no extra render-blocking network
      // round-trip; kept CSP-strict via a script-src hash in vercel.json
      // instead of 'unsafe-inline'. If you edit this script, the hash in
      // vercel.json's CSP must be regenerated to match, or it'll be blocked.
      // Regenerate with:
      //   node -e "…crypto.createHash('sha256').update(SCRIPT_TEXT)…base64"
      (function () {
        // Marks that scripting is live. Scroll-reveal starts at opacity:0 and
        // is un-hidden by an IntersectionObserver; every route is prerendered
        // to static HTML, so without this flag a visitor whose JS fails to run
        // would get a fully-populated page rendered invisible. CSS hides
        // reveals only under `.js`, so no-JS keeps the content on screen.
        document.documentElement.classList.add("js");
        try {
          var t = localStorage.getItem("theme");
          if (!t)
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

         200KB combined) so none of them are ever discovered late via the CSS
         @font-face parse. A font that finishes loading mid-render forces the
         browser to recompute text layout against the real metrics instead of
         the fallback's — a real, traced forced-reflow source (not
         script-triggered, so tools can't point at a JS call site for it), and
         it also shortens the network dependency chain: these fetches now
         start in parallel with the CSS instead of chained behind it. -->
