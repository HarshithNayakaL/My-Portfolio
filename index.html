      // Set theme before first paint (no flash). Stored choice wins,
      // otherwise follow the OS preference.
      // Inline (not external) so there's no extra render-blocking network
      // round-trip; kept CSP-strict via a script-src hash in vercel.json
      // instead of 'unsafe-inline'. If you edit this script, the hash in
      // vercel.json's CSP must be regenerated to match, or it'll be blocked.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (!t)
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

         the fallback's — a real, traced forced-reflow source (not
